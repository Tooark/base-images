name: Base Images Samples

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dockerx:
    runs-on: ubuntu-latest
    steps:
      - name: docker version
        run: docker run --rm ghcr.io/tooark/docker:latest docker --version
      - name: buildx version
        run: docker run --rm ghcr.io/tooark/docker:latest docker buildx version

  aws_cli:
    runs-on: ubuntu-latest
    steps:
      - name: aws-cli version
        run: docker run --rm ghcr.io/tooark/aws-cli:latest aws --version
      - name: kubectl version
        run: docker run --rm ghcr.io/tooark/aws-cli:latest kubectl version --client

  gcloud_cli:
    runs-on: ubuntu-latest
    steps:
      - name: gcloud version
        run: docker run --rm ghcr.io/tooark/gcloud-cli:latest gcloud --version
      - name: kubectl version
        run: docker run --rm ghcr.io/tooark/gcloud-cli:latest kubectl version --client

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: terraform version
        run: docker run --rm ghcr.io/tooark/terraform:latest terraform version

  terraform_aws:
    runs-on: ubuntu-latest
    steps:
      - name: terraform version
        run: docker run --rm ghcr.io/tooark/terraform-aws:latest terraform version
      - name: aws version
        run: docker run --rm ghcr.io/tooark/terraform-aws:latest aws --version

  terraform_gcloud:
    runs-on: ubuntu-latest
    steps:
      - name: terraform version
        run: docker run --rm ghcr.io/tooark/terraform-gcloud:latest terraform version
      - name: gcloud version
        run: docker run --rm ghcr.io/tooark/terraform-gcloud:latest gcloud --version

  terraform_aws_gcloud:
    runs-on: ubuntu-latest
    steps:
      - name: terraform version
        run: docker run --rm ghcr.io/tooark/terraform-aws-gcloud:latest terraform version
      - name: aws version
        run: docker run --rm ghcr.io/tooark/terraform-aws-gcloud:latest aws --version
      - name: gcloud version
        run: docker run --rm ghcr.io/tooark/terraform-aws-gcloud:latest gcloud --version

  sonar_scanner:
    runs-on: ubuntu-latest
    steps:
      - name: sonar-scanner version
        run: docker run --rm ghcr.io/tooark/sonar-scanner:latest sonar-scanner --version
      - name: java version
        run: docker run --rm ghcr.io/tooark/sonar-scanner:latest java -version

  trivy_hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-cache-${{ runner.os }}
      - name: ark-tools version
        run: docker run --rm ghcr.io/tooark/trivy-hadolint:latest ark-tools version
      - name: image scan sample
        run: |
          docker run --rm \
            -v "$HOME/.cache/trivy:/home/app/.cache/trivy" \
            -v "${{ github.workspace }}/scan-reports:/reports" \
            -e TRIVY_SEVERITY=HIGH,CRITICAL \
            -e TRIVY_SEVERITY_FAIL=HIGH,CRITICAL \
            ghcr.io/tooark/trivy-hadolint:latest \
            ark-tools image-scan nginx:latest
      - name: container scan sample
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "$HOME/.cache/trivy:/home/app/.cache/trivy" \
            -v "${{ github.workspace }}/scan-reports:/reports" \
            -e GITHUB_ACTIONS -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e GITHUB_REPOSITORY -e GITHUB_ACTOR \
            -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_SERVER_URL \
            -e TRIVY_SEVERITY=HIGH,CRITICAL \
            -e TRIVY_SEVERITY_FAIL=HIGH,CRITICAL \
            -e TRIVY_IGNORE_UNFIXED=true \
            -e HADOLINT_FAILURE_LEVEL=warning \
            ghcr.io/tooark/trivy-hadolint:latest \
            ark-tools container nginx:latest --path /workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-hadolint-reports
          path: ${{ github.workspace }}/scan-reports/
