name: Cleanup Old Docker Images

# Política de retenção de imagens no GHCR (implementada pela action Arklean):
#   - Untagged / manifests órfãos ......... excluir após 7 dias
#   - Tags de commit ou branch ............ excluir após 30 dias
#   - Últimas versões ..................... manter pelo menos 10
#   - Releases SemVer (v1.2.3 / 1.2.3) .... preservar sempre
#   - latest, stable e production ......... preservar sempre
#
# A action Tooark/action-ark-clean (Arklean) aplica essa política por padrão:
# protected-tags cobre latest/stable/production/SemVer e ephemeral-tags cobre
# tags de SHA, branch e scan. Protege automaticamente os manifests-filhos por
# arquitetura (multi-arch) e os referrers (assinaturas/atestados/SBOMs Cosign),
# valida o inventário antes e depois da exclusão e só apaga quando
# confirm-delete corresponde exatamente a owner/package.
# Por ser uma action first-party (mantida pela própria Tooark), é usada pela
# major tag v0, recebendo correções automaticamente a cada release.
#
# IMPORTANTE — semântica dos orçamentos (max-deletions / max-delete-percentage):
# são portões fail-closed, NÃO fatias. Se o plano exceder qualquer um dos dois,
# a execução aborta com ABORTED_BUDGET_EXCEEDED e NADA é excluído — não existe
# "apagar até o limite e deixar o resto para a próxima execução". Por isso a
# primeira passada de backlog usa orçamentos altos (100 / 100%); depois de
# zerar o backlog, reduzir para o regime permanente conservador (20 / 25%).
#
# MODO DE EXECUÇÃO (fase de validação):
#   - agendado (cron) ..... SEMPRE dry-run: só gera o plano, nada é excluído
#   - manual (dispatch) ... dry-run por padrão; desmarcar o checkbox para
#                           aplicar de verdade
# Após a validação (2 ciclos agendados com planos revisados + pull de imagem
# multi-arch retida depois de um apply), trocar a expressão de dry-run para
# permitir apply agendado:
#   dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

permissions:
  contents: read
  packages: write

on:
  schedule:
    # Execução semanal: segunda-feira às 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run: apenas loga o que seria excluído, sem apagar"
        type: boolean
        default: true

concurrency:
  group: image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image:
          - aws-cli
          - gcloud-cli
          - tofu
          - tofu-aws
          - tofu-gcloud
          - tofu-aws-gcloud
          - sonar-scanner
          - trivy-hadolint
          - dockerx
          - security-scanner
          - terraform
          - terraform-aws
          - terraform-gcloud
          - terraform-aws-gcloud
    steps:
      # Um único passo cobre tags efêmeras antigas e manifests untagged/órfãos.
      # Os defaults da action já correspondem à política acima
      # (ephemeral-retention-days: 30, untagged-retention-days: 7,
      # keep-latest: 10); delete-untagged precisa ser habilitado explicitamente.
      - name: Cleanup old images (Arklean)
        id: arklean
        uses: Tooark/action-ark-clean@v0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.image }}
          delete-untagged: true
          # Validação: agendado fica em dry-run; apply só manual e consciente.
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
          confirm-delete: ${{ github.repository_owner }}/${{ matrix.image }}
          # Primeira passada (backlog): orçamentos altos de propósito — um
          # plano que exceda qualquer orçamento aborta POR INTEIRO (nota no
          # topo). Regime permanente após o backlog: 20 / 25.
          max-deletions: 100
          max-delete-percentage: 100

      # Publica o plano (e o relatório de apply, quando existir) como artifact
      # de auditoria — inclusive quando um orçamento aborta: desde a v0.1.1 o
      # plan-path é emitido antes dos portões de segurança.
      - name: Upload audit plan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arklean-plan-${{ matrix.image }}
          path: ${{ runner.temp }}/arklean-*.json
          if-no-files-found: ignore
          retention-days: 90
