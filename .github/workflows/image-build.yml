name: Build and Push Docker Images

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [main]
    paths:
      - ".trivyignore"
      - "**/Dockerfile"
      - "**/VERSION"
      - ".github/workflows/image-build.yml"
      - "versions.env"
  pull_request:
    branches: [main]
    paths:
      - ".trivyignore"
      - "**/Dockerfile"
      - "**/VERSION"
      - ".github/workflows/image-build.yml"
      - "versions.env"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.load.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load and export versions
        id: load
        run: |
          set -eu
          VERSIONS_JSON="{}"
          while IFS='=' read -r k v; do
            k=$(printf '%s' "$k" | tr -d '\r')
            v=$(printf '%s' "$v" | tr -d '\r')
            if [ -n "$k" ] && [ "${k#'#'}" = "$k" ] && [ -n "$v" ]; then
              VERSIONS_JSON=$(echo "$VERSIONS_JSON" | jq --arg key "$k" --arg val "$v" '. + {($key): $val}')
            fi
          done < versions.env
          echo "versions=$(echo "$VERSIONS_JSON" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Set up support for more platforms with QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - aws-cli
          - gcloud-cli
          - terraform
          - terraform-aws
          - terraform-gcloud
          - terraform-aws-gcloud
          - sonar-scanner
          - trivy-hadolint
          - dockerx
    env:
      REGISTRY: ghcr.io/tooark
      TRIVY_SCANNER_IMAGE: ghcr.io/tooark/trivy-hadolint:1.70
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load versions from setup job
        run: |
          set -eu
          VERSIONS='${{ needs.setup.outputs.versions }}'
          echo "$VERSIONS" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Compute version tags
        id: tags
        run: |
          set -eu

          IMAGE="${{ matrix.image }}"

          # Descobrir variável primária de versão
          if [ -f "$IMAGE/VERSION" ]; then
            PRIMARY_VAR=$(grep -v '^[#[:space:]]*$' "$IMAGE/VERSION" | head -1 | tr -d '\r')
          else
            PRIMARY_VAR=$(echo "$IMAGE" | tr '[:lower:]-' '[:upper:]_')_VERSION
          fi

          echo "Primary version variable: $PRIMARY_VAR"

          FULL_VERSION=$(printf '%s' "${!PRIMARY_VAR:-}" | tr -d '\r')

          if [ -z "$FULL_VERSION" ]; then
            echo "Nenhuma versão encontrada em $PRIMARY_VAR; usando 'latest'" >&2
            echo "full=latest" >> $GITHUB_OUTPUT
            echo "short=latest" >> $GITHUB_OUTPUT
            echo "major=latest" >> $GITHUB_OUTPUT
            exit 0
          fi

          # full = major.minor.patch ; short = major.minor ; major = major
          SHORT_VERSION=$(echo "$FULL_VERSION" | awk -F. '{ if (NF>=2) {print $1"."$2} else {print $1} }')
          MAJOR_VERSION=$(echo "$FULL_VERSION" | awk -F. '{ print $1 }')

          echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "short=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR_VERSION" >> $GITHUB_OUTPUT

      - name: Check if image folder changed
        id: detect
        run: |
          set -eu

          IMAGE="${{ matrix.image }}"
          BEFORE="${{ github.event.before }}"
          CURRENT="${{ github.sha }}"

          # If there is no previous commit (first commit), always build.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Load changed files between commits
          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$CURRENT" || true)

          # Checks if files in the image folder have been modified.
          if echo "$CHANGED_FILES" | grep -E "^$IMAGE/" >/dev/null 2>&1; then
            echo "build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if relevant version variables have changed.
          VAR_LIST=""
          if [ -f "$IMAGE/VERSION" ]; then
            VAR_LIST=$(grep -v '^[#[:space:]]*$' "$IMAGE/VERSION" | tr -d '\r')
          else
            VAR_LIST=$(echo "$IMAGE" | tr '[:lower:]-' '[:upper:]_')_VERSION
          fi

          echo "Version variables for $IMAGE: $VAR_LIST"

          # Check if versions.env changed relevant variables
          if echo "$CHANGED_FILES" | grep -q "^versions.env$"; then
            
            OLD_VERS=$(git show "$BEFORE":versions.env 2>/dev/null || echo "")
            NEW_VERS=$(cat versions.env)
            base_old=$(echo "$OLD_VERS" | awk -F= '$1=="BASE_IMAGE" {print $2}')
            base_new=$(echo "$NEW_VERS" | awk -F= '$1=="BASE_IMAGE" {print $2}')
            changed=false

            # Check BASE_IMAGE change
            if [ "$base_old" != "$base_new" ]; then
              echo "BASE_IMAGE changed ($base_old -> $base_new)"; changed=true;
            fi
            
            # Check other version variables
            for var in $VAR_LIST; do
              old_val=$(echo "$OLD_VERS" | awk -F= -v v="$var" '$1==v {print $2}')
              new_val=$(echo "$NEW_VERS" | awk -F= -v v="$var" '$1==v {print $2}')

              # Check if variable changed
              if [ "$old_val" != "$new_val" ]; then
                echo "$var changed ($old_val -> $new_val)";
                changed=true;
              fi
            done

            # If any relevant variable changed, mark for build
            if [ "$changed" = true ]; then
              echo "build=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "build=false" >> $GITHUB_OUTPUT

      - name: Build image locally for scan (amd64 only)
        if: ${{ steps.detect.outputs.build == 'true' }}
        run: |
          set -eu

          IMAGE_OWNER="${{ github.repository_owner }}"
          IMAGE_OWNER_LOWER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          SCAN_IMAGE=ghcr.io/$IMAGE_OWNER_LOWER/${{ matrix.image }}:scan-${{ github.sha }}

          # Prepare build arguments (shared with the push step via output)
          BUILD_ARGS=""

          if [ -f ./${{ matrix.image }}/VERSION ]; then
            VAR_LIST=$(grep -v '^[#[:space:]]*$' ./${{ matrix.image }}/VERSION | tr -d '\r')
            for var in $VAR_LIST; do
              val=$(printf '%s' "${!var:-}" | tr -d '\r')
              if [ -n "$val" ]; then
                BUILD_ARGS="$BUILD_ARGS --build-arg $var=$val"
              fi
            done
          else
            var=$(echo "${{ matrix.image }}" | tr '[:lower:]-' '[:upper:]_')_VERSION
            val=$(printf '%s' "${!var:-}" | tr -d '\r')
            if [ -n "$val" ]; then
              BUILD_ARGS="$BUILD_ARGS --build-arg $var=$val"
            fi
          fi

          BASE_IMAGE_CLEAN=$(printf '%s' "${BASE_IMAGE:-}" | tr -d '\r')
          if [ -n "$BASE_IMAGE_CLEAN" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-arg BASE_IMAGE=${BASE_IMAGE_CLEAN}"
          fi

          # Build single-arch image and load into local daemon for scanning
          docker buildx build --platform linux/amd64 \
            $BUILD_ARGS \
            -t "$SCAN_IMAGE" \
            ./${{ matrix.image }} --load

          # Export image name and build args for subsequent steps
          echo "SCAN_IMAGE=$SCAN_IMAGE" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=$BUILD_ARGS"  >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        if: ${{ steps.detect.outputs.build == 'true' }}
        run: |
          set -eu

          IGNORE_FILE="./${{ matrix.image }}/.trivyignore"
          DOCKER_IGNORE_ARGS=()
          if [ -f "$IGNORE_FILE" ]; then
            echo "Using Trivy ignore file: $IGNORE_FILE"
            DOCKER_IGNORE_ARGS=(-e TRIVY_IGNOREFILE="/workspace/${{ matrix.image }}/.trivyignore")
          else
            echo "No Trivy ignore file found for ${{ matrix.image }}, scanning without --ignorefile"
          fi

          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            --group-add "$DOCKER_GID" \
            -e TRIVY_FORMAT="table" \
            "${DOCKER_IGNORE_ARGS[@]}" \
            "$TRIVY_SCANNER_IMAGE" \
            image-scan "$SCAN_IMAGE"

      - name: Build and push image (multi-arch)
        if: ${{ steps.detect.outputs.build == 'true' }}
        run: |
          set -eu

          IMAGE_OWNER="${{ github.repository_owner }}"
          IMAGE_OWNER_LOWER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$IMAGE_OWNER_LOWER/${{ matrix.image }}

          # Load optional image description from DESCRIPTION file
          DESC_FILE="./${{ matrix.image }}/DESCRIPTION"
          if [ -f "$DESC_FILE" ]; then
            DESCRIPTION=$(sed -e 's/\r//g' "$DESC_FILE" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //' -e 's/ $//')
          else
            DESCRIPTION="Base image: ${{ matrix.image }}"
          fi

          # Build and push the multi-arch image with labels
          # BUILD_ARGS was exported by the scan step via GITHUB_ENV
          docker buildx build --platform linux/amd64,linux/arm64 \
            $BUILD_ARGS \
            --label "org.opencontainers.image.title=${{ matrix.image }}" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            --label "org.opencontainers.image.source=${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.tags.outputs.full }}" \
            -t $IMAGE_NAME:${{ steps.tags.outputs.full }} \
            -t $IMAGE_NAME:${{ steps.tags.outputs.short }} \
            -t $IMAGE_NAME:${{ steps.tags.outputs.major }} \
            -t $IMAGE_NAME:latest \
            ./${{ matrix.image }} --push

          # Remove local scan image to free disk space
          docker rmi "$SCAN_IMAGE" || true

      - name: Create and push tag
        if: ${{ steps.detect.outputs.build == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ matrix.image }}-${{ steps.tags.outputs.full }}"

          # don't fail if tag already exists
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag $TAG_NAME already exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

          # push the tag using the repo credentials available in the runner
          git push origin refs/tags/$TAG_NAME

      - name: Create GitHub Release (gh)
        if: ${{ steps.detect.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG_NAME="${{ matrix.image }}-${{ steps.tags.outputs.full }}"
          IMAGE_OWNER="${{ github.repository_owner }}"
          IMAGE_NAME="ghcr.io/$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}"

          # Skip if release already exists
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, skipping"
            exit 0
          fi

          # Read image description
          DESC_FILE="./${{ matrix.image }}/DESCRIPTION"
          if [ -f "$DESC_FILE" ]; then
            DESCRIPTION=$(sed -e 's/\r//g' "$DESC_FILE" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //' -e 's/ $//')
          else
            DESCRIPTION="${{ matrix.image }}"
          fi

          # Build tools table from VERSION file
          # Lines whose variable names match known tools are included; composite vars are skipped.
          TOOLS_TABLE="| Tool | Version |\n|------|---------|\n"
          if [ -f "./${{ matrix.image }}/VERSION" ]; then
            while IFS= read -r var; do
              var=$(printf '%s' "$var" | tr -d '\r')
              [ -z "$var" ] && continue
              val=$(printf '%s' "${!var:-}" | tr -d '\r')
              [ -z "$val" ] && continue
              case "$var" in
                TERRAFORM_VERSION)      TOOL_NAME="Terraform" ;;
                AWSCLI_VERSION)         TOOL_NAME="AWS CLI" ;;
                GCLOUD_VERSION)         TOOL_NAME="Google Cloud SDK" ;;
                KUBECTL_VERSION)        TOOL_NAME="kubectl" ;;
                SONAR_CLI_VERSION)      TOOL_NAME="Sonar Scanner CLI" ;;
                TRIVY_VERSION)          TOOL_NAME="Trivy" ;;
                HADOLINT_VERSION)       TOOL_NAME="Hadolint" ;;
                DOCKER_VERSION)         TOOL_NAME="Docker CLI" ;;
                DOCKER_BUILDX_VERSION)  TOOL_NAME="Docker Buildx" ;;
                *)                 continue ;;
              esac
              TOOLS_TABLE="${TOOLS_TABLE}| ${TOOL_NAME} | \`${val}\` |\n"
            done < "./${{ matrix.image }}/VERSION"
          fi

          # Generate release notes file
          NOTES_FILE="$(mktemp)"
          printf "## %s \`%s\`\n\n" "${{ matrix.image }}" "${{ steps.tags.outputs.full }}" > "$NOTES_FILE"
          printf "%s\n\n" "$DESCRIPTION" >> "$NOTES_FILE"
          printf "### Docker Image\n\n" >> "$NOTES_FILE"
          printf "| Tag | Image |\n|-----|-------|\n" >> "$NOTES_FILE"
          printf "| Patch version | \`%s:%s\` |\n"    "$IMAGE_NAME" "${{ steps.tags.outputs.full }}"  >> "$NOTES_FILE"
          printf "| Minor version | \`%s:%s\` |\n"   "$IMAGE_NAME" "${{ steps.tags.outputs.short }}" >> "$NOTES_FILE"
          printf "| Major version | \`%s:%s\` |\n"   "$IMAGE_NAME" "${{ steps.tags.outputs.major }}" >> "$NOTES_FILE"
          printf "| Latest | \`%s:latest\` |\n\n"    "$IMAGE_NAME" >> "$NOTES_FILE"
          printf "### Included Tools\n\n" >> "$NOTES_FILE"
          printf "%b" "$TOOLS_TABLE" >> "$NOTES_FILE"

          gh release create "$TAG_NAME" \
            --title "${{ matrix.image }}-${{ steps.tags.outputs.full }}" \
            --notes-file "$NOTES_FILE"

          rm -f "$NOTES_FILE"
