name: Update Tool Versions

on:
  # Sábado, 03:00 UTC
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest stable versions
        run: python3 script/fetch-latest-stable-versions.py

      - name: Update versions.env
        id: update
        run: python3 script/update-versions.py

      - name: Show diff
        if: steps.update.outputs.changed == 'true'
        run: git --no-pager diff -- versions.env ./*/.trivyignore

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          source versions.env
          git add versions.env ./*/.trivyignore
          git commit -m "chore(versions): AWS ${AWSCLI_VERSION} | GCloud ${GCLOUD_VERSION} | K8s ${KUBECTL_VERSION} | Tofu ${OPENTOFU_VERSION} | Sonar ${SONAR_CLI_VERSION} | Trivy ${TRIVY_VERSION} | Hadolint ${HADOLINT_VERSION} | Docker ${DOCKER_VERSION} | Buildx ${DOCKER_BUILDX_VERSION}"
          git push

      - name: Trigger image build workflow
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/image-build.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'

      - name: No changes
        if: steps.update.outputs.changed != 'true'
        run: echo "No version updates found."
